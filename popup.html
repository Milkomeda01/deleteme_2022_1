<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>FLOA Cdiscount</title>
    <style>
      body {
        font-family: -apple-system, Segoe UI, sans-serif;
        width: 280px;
        padding: 12px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 0 0 10px;
        padding: 8px 10px 10px;
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        color: #555;
        padding: 0 4px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        padding: 4px 0;
        cursor: pointer;
      }
      button#launch {
        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #1035bb;
        color: white;
      }
      button#launch:hover {
        background: #0c2a94;
      }
      #settings-link {
        display: block;
        text-align: center;
        margin-top: 10px;
        font-size: 12px;
        color: #1035bb;
        cursor: pointer;
        text-decoration: underline;
        background: none;
        border: none;
        width: 100%;
      }
      .prod-warning {
        color: #b3261e;
        font-weight: 600;
      }
      #prod-notice {
        display: none;
        font-size: 11px;
        color: #b3261e;
        background: #fde8e6;
        border: 1px solid #f2b8b5;
        border-radius: 6px;
        padding: 6px 8px;
        margin: -4px 0 10px;
      }
    </style>
  </head>
  <body>
    <h1>Lancer la souscription</h1>

    <fieldset>
      <legend>1. Environnement</legend>
      <label><input type="radio" name="env" value="souscrire" checked /> souscrire (preprod)</label>
      <label><input type="radio" name="env" value="validation-souscrire" /> validation-souscrire</label>
      <label><input type="radio" name="env" value="prod-souscrire" /> <span class="prod-warning">souscrire (PRODUCTION)</span></label>
    </fieldset>
    <div id="prod-notice">⚠️ Environnement de PRODUCTION reelle. L'extension s'arrete toujours avant la Signature, mais verifie bien chaque champ.</div>

    <fieldset>
      <legend>2. Produit</legend>
      <label><input type="radio" name="card" value="cdiscount" checked /> Carte Cdiscount</label>
      <label><input type="radio" name="card" value="cdiscount_cla" /> Carte Cdiscount CLA</label>
    </fieldset>

    <fieldset>
      <legend>3. Identite (select 3)</legend>
      <label><input type="radio" name="person" value="me" checked /> Moi</label>
      <label><input type="radio" name="person" value="random" /> Aleatoire (ne rien selectionner)</label>
    </fieldset>

    <button id="launch">Lancer</button>
    <button id="settings-link">⚙️ Reglages (mon prenom/nom)</button>

    <script src="popup.js"></script>
  </body>
</html>
